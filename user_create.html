<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити користувача - Музична Лабораторія</title>
    <link rel="stylesheet" href="style/main.css">
</head>

<body class="dialog-body">

    <header class="global-header">
    <nav class="global-nav">
        <a href="index.html" class="nav-link">Головна</a>
        <a href="song_list.html" class="nav-link">Пісні</a>
        <a href="artist_list.html" class="nav-link">Артисти</a>
        <a href="analytics.html" class="nav-link">Аналітика</a>
        <a href="users.html" class="nav-link">Користувачі</a>
    </nav>

    <div class="header-actions">
        <a href="login.html" class="btn-secondary">Увійти</a>
    </div>
</header>

    <main class="dialog-container">
        <section class="dialog-card">
            <header class="dialog-header">
                <h2 class="dialog-title">Create user dialog</h2>
            </header>

            <form action="users.html" method="post" class="user-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="confirm-password" class="form-label">Confirm password</label>
                    <input type="password" id="confirm-password" name="confirm_password" class="form-input" required>
                </div>

                <div class="form-group">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" name="role" class="form-input">
                        <option value="regular">Regular</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <nav class="dialog-actions">
                    <button type="submit" class="btn-primary">Ok</button>
                    <a href="users.html" class="btn-secondary">Cancel</a>
                </nav>
            </form>
        </section>
    </main>

    <footer class="global-footer">
        <p>© 2026 Музична Лабораторія. Усі права захищено.</p>
    </footer>

</body>
</html>
