<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід у систему - Музична Лабораторія</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body>

    <header class="global-header">
    <nav class="global-nav">
        <a href="index.html" class="nav-link">Головна</a>
        <a href="song_list.html" class="nav-link">Пісні</a>
        <a href="artist_list.html" class="nav-link">Артисти</a>
        <a href="analytics.html" class="nav-link">Аналітика</a>
        <a href="users.html" class="nav-link">Користувачі</a>
    </nav>

    <div class="header-actions">
        <a href="login.html" class="btn-secondary">Увійти</a>
    </div>
</header>

    <main class="dialog-container">
    <section class="login-container">
        <h1 class="login-title">Вхід у систему</h1>

        <div class="alert-error">
            Невірний логін або пароль. Спробуйте ще раз.
        </div>

        <form action="index.html" method="post" class="login-form">
            <div class="form-group">
                <label for="username">Ім'я користувача</label>
                <input type="text" id="username" name="username" class="form-input input-error" placeholder="Введіть ваш логін" required>
                <span class="validation-message">Це поле є обов'язковим</span>
            </div>

            <div class="form-group">
                <label for="password">Пароль</label>
                <input type="password" id="password" name="password" class="form-input" placeholder="Введіть ваш пароль" required>
            </div>

            <button type="submit" class="btn-primary">Увійти</button>
        </form>
    </section>
</main>

    <footer class="global-footer">
        <p>© 2026 Музична Лабораторія. Усі права захищено.</p>
    </footer>

</body>
</html>
