<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагувати користувача - Музична Лабораторія</title>
    <link rel="stylesheet" href="style/main.css">
</head>
<body class="dialog-body">

    <header class="global-header">
    <nav class="global-nav">
        <a href="index.html" class="nav-link">Головна</a>
        <a href="song_list.html" class="nav-link">Пісні</a>
        <a href="artist_list.html" class="nav-link">Артисти</a>
        <a href="analytics.html" class="nav-link">Аналітика</a>
        <a href="users.html" class="nav-link">Користувачі</a>
    </nav>

    <div class="header-actions">
        <a href="login.html" class="btn-secondary">Увійти</a>
    </div>
</header>

    <main class="dialog-container">
        <section class="dialog-card">
            <header class="dialog-header">
                <h2 class="dialog-title">Edit user screen</h2>
            </header>

            <form action="users.html" method="post" class="user-form">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" value="test_user" required>
                </div>

                <div class="form-group">
                    <label for="role" class="form-label">Role</label>
                    <select id="role" name="role" class="form-input">
                        <option value="regular" selected>Regular</option>
                        <option value="admin">Admin</option>
                    </select>
                </div>

                <nav class="dialog-actions">
                    <button type="submit" class="btn-primary">Save changes</button>
                    <a href="users.html" class="btn-secondary">Cancel</a>
                </nav>
            </form>

            <hr class="divider">

            <section class="delete-section">
                <p class="delete-warning">Увага! Ця дія є незворотною.</p>
                <form action="users.html" method="post" class="delete-form">
                    <button type="submit" class="btn-danger">Delete user</button>
                </form>
            </section>
        </section>
    </main>

    <footer class="global-footer">
        <p>© 2026 Музична Лабораторія. Усі права захищено.</p>
    </footer>

</body>
</html>
